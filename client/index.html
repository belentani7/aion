  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module">
      const analyticsEndpoint = (import.meta.env.VITE_ANALYTICS_ENDPOINT || '').trim();
      const analyticsWebsiteId = (import.meta.env.VITE_ANALYTICS_WEBSITE_ID || '').trim();
      if (analyticsEndpoint && analyticsWebsiteId) {
        try {
          const endpoint = new URL(analyticsEndpoint);
          if (endpoint.protocol === 'https:' && !endpoint.username && !endpoint.password) {
            endpoint.pathname = `${endpoint.pathname.replace(/\/+$/, '')}/umami`;
            const analyticsScript = document.createElement('script');
            analyticsScript.src = endpoint.toString();
            analyticsScript.defer = true;
            analyticsScript.dataset.websiteId = analyticsWebsiteId.trim();
            document.head.append(analyticsScript);
          }
        } catch {
          // Invalid or untrusted analytics configuration leaves tracking disabled.
        }
      }
    </script>
  </body>
