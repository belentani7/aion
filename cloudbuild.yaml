# Cloud Build configuration for AION Unified
# Triggers on push to main branch
# Builds multi-stage Docker image and deploys to Cloud Run
# Uses Secret Manager for all sensitive configuration

steps:
  # Step 1: Run dependency audit (must pass)
  - name: 'gcr.io/cloud-builders/npm'
    id: 'dependency-audit'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npm install -g pnpm@10 --no-audit --no-fund
        pnpm install --frozen-lockfile
        pnpm audit --omit=dev --audit-level=high
        echo "✓ Production audit passed"
    timeout: 300s

  # Step 2: Run lint and typecheck
  - name: 'gcr.io/cloud-builders/npm'
    id: 'lint-typecheck'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npm install -g pnpm@10 --no-audit --no-fund
        pnpm install --frozen-lockfile
        pnpm check
        pnpm format --check
    timeout: 300s

  # Step 3: Run tests
  - name: 'gcr.io/cloud-builders/npm'
    id: 'run-tests'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npm install -g pnpm@10 --no-audit --no-fund
        pnpm install --frozen-lockfile
        pnpm test
    timeout: 600s

  # Step 4: Build Docker image (uses secret build args for build-time secrets)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/aion-docker/aion:$COMMIT_SHA'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/aion-docker/aion:latest'
      - '--cache-from'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/aion-docker/aion:latest'
      - '--build-arg'
      - 'BUILDKIT_INLINE_CACHE=1'
      - '--secret'
      - 'id=mysql-root-password,src=mysql-root-password'
      - '--secret'
      - 'id=mysql-password,src=mysql-password'
      - '--secret'
      - 'id=mysql-user,src=mysql-user'
      - '--secret'
      - 'id=mysql-database,src=mysql-database'
      - '--secret'
      - 'id=jwt-secret,src=jwt-secret'
      - '.'
    timeout: 600s

  # Step 5: Push Docker image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/aion-docker/aion:$COMMIT_SHA'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/aion-docker/aion:latest'
    timeout: 300s

  # Step 6: Deploy to Cloud Run (staging) - uses Secret Manager for runtime secrets
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-staging'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'aion-staging'
      - '--image=europe-west1-docker.pkg.dev/$PROJECT_ID/aion-docker/aion:$COMMIT_SHA'
      - '--region=europe-west1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--service-account=aion-cloudrun@$PROJECT_ID.iam.gserviceaccount.com'
      - '--set-secrets=MYSQL_ROOT_PASSWORD=mysql-root-password:latest,MYSQL_PASSWORD=mysql-password:latest,MYSQL_USER=mysql-user:latest,MYSQL_DATABASE=mysql-database:latest,JWT_SECRET=jwt-secret:latest,STRIPE_SECRET_KEY=stripe-secret-key:latest,STRIPE_WEBHOOK_SECRET=stripe-webhook-secret:latest,STRIPE_PRO_PRICE_ID=stripe-pro-price-id:latest,STRIPE_ENTERPRISE_PRICE_ID=stripe-enterprise-price-id:latest,COMPLIANCE_API_URL=compliance-api-url:latest,SCHEDULING_API_URL=scheduling-api-url:latest,DILIGENCE_API_URL=diligence-api-url:latest,CLIENT_ORIGIN=client-origin:latest'
      - '--set-env-vars=NODE_ENV=production,ADR_0012_AUDIT=true,COMPLIANCE_JURISDICTION=ES,COOKIE_DOMAIN=,AION_WORKSPACE_ROOT=,AION_AGENT_APPROVED=NO'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--cpu=1'
      - '--memory=512Mi'
      - '--port=3000'
    timeout: 300s
    env:
      - 'CLOUDSDK_CORE_PROJECT=$PROJECT_ID'

  # Step 7: Smoke test deployment
  - name: 'gcr.io/cloud-builders/curl'
    id: 'smoke-test'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        URL=$(gcloud run services describe aion-staging --region=europe-west1 --format='value(status.url)')
        echo "Testing $URL/api/health"
        for i in {1..5}; do
          if curl -f -s "$URL/api/health" > /dev/null; then
            echo "✓ Health check passed"
            exit 0
          fi
          echo "Attempt $i failed, retrying in 10s..."
          sleep 10
        done
        echo "✗ Health check failed after 5 attempts"
        exit 1
    timeout: 120s

images:
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/aion-docker/aion:$COMMIT_SHA'
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/aion-docker/aion:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: 100

substitutions:
  _REGION: 'europe-west1'
  _SERVICE_NAME: 'aion-staging'

tags:
  - 'aion-unified'
  - 'cloud-run'
  - 'staging'

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/mysql-root-password/versions/latest
      env: 'MYSQL_ROOT_PASSWORD'
    - versionName: projects/$PROJECT_ID/secrets/mysql-password/versions/latest
      env: 'MYSQL_PASSWORD'
    - versionName: projects/$PROJECT_ID/secrets/mysql-user/versions/latest
      env: 'MYSQL_USER'
    - versionName: projects/$PROJECT_ID/secrets/mysql-database/versions/latest
      env: 'MYSQL_DATABASE'
    - versionName: projects/$PROJECT_ID/secrets/jwt-secret/versions/latest
      env: 'JWT_SECRET'
    - versionName: projects/$PROJECT_ID/secrets/stripe-secret-key/versions/latest
      env: 'STRIPE_SECRET_KEY'
    - versionName: projects/$PROJECT_ID/secrets/stripe-webhook-secret/versions/latest
      env: 'STRIPE_WEBHOOK_SECRET'
    - versionName: projects/$PROJECT_ID/secrets/stripe-pro-price-id/versions/latest
      env: 'STRIPE_PRO_PRICE_ID'
    - versionName: projects/$PROJECT_ID/secrets/stripe-enterprise-price-id/versions/latest
      env: 'STRIPE_ENTERPRISE_PRICE_ID'
    - versionName: projects/$PROJECT_ID/secrets/compliance-api-url/versions/latest
      env: 'COMPLIANCE_API_URL'
    - versionName: projects/$PROJECT_ID/secrets/scheduling-api-url/versions/latest
      env: 'SCHEDULING_API_URL'
    - versionName: projects/$PROJECT_ID/secrets/diligence-api-url/versions/latest
      env: 'DILIGENCE_API_URL'
    - versionName: projects/$PROJECT_ID/secrets/client-origin/versions/latest
      env: 'CLIENT_ORIGIN'