name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install from committed lockfile
        run: npm ci --ignore-scripts --legacy-peer-deps
      - name: Prevent silent CI bypasses
        run: node --test validation/ci-gates.test.mjs
      - name: OAuth persistence regression
        run: node --test validation/db-upsert.test.mjs
      - name: Typecheck
        run: npm run check
      - name: Tests
        run: npm test
      - name: Source dependency contract
        run: node validation/source-contract.mjs
      - name: Production build
        run: npm run build
