# generated by belentani_omega - safe to overwrite
name: CI (pnpm)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  audit:
    name: Dependency Audit (ADR-0012)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g pnpm@10 --no-audit --no-fund
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit — Production only (MUST PASS)
        run: pnpm audit --omit=dev --audit-level=high
      - name: Audit — Dev (documented exceptions only)
        run: |
          pnpm audit --audit-level=high || true
          # EXCEPCIONES DOCUMENTADAS (ADR-0012):
          # - AION is a web app (React + Express + Vite), NOT Electron
          # - No electron-builder chain exists in this project
          # - http-cache-semantics / sprintf-js advisories are N/A
          echo "Dev audit completed — exceptions documented in ADR-0012"

  lint-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g pnpm@10 --no-audit --no-fund
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm format --check

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g pnpm@10 --no-audit --no-fund
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [audit, lint-typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g pnpm@10 --no-audit --no-fund
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build